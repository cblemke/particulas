<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Simulación de partículas (Rust + WASM)</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; color: #eee; overflow: hidden; }
      canvas { display: block; margin: 0 auto; background: #000; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div style="position:fixed; left:10px; top:10px; background:#222; color:#ddd; padding:15px; border-radius:8px; font:14px system-ui">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px">
        <button id="formar" class="action-btn">Esfera</button>
        <button id="pendulo" class="action-btn">Péndulo Invertido</button>
      </div>

      <div style="display:flex; gap:8px; margin-bottom:12px">
        <button id="perturbar" class="control-btn">Perturbar</button>
        <button id="liberar" class="control-btn">Liberar</button>
      </div>

      <input id="text" 
             type="text" 
             placeholder="Escribe algo..." 
             style="width: 100%; padding: 4px; margin-bottom: 12px; 
                    background: #333; border: 1px solid #444; 
                    color: #fff; border-radius: 4px" />

      <label style="display:block">
        <span style="display:block; margin-bottom:4px">Gravedad:</span>
        <input id="gravity" 
               type="range" 
               min="-1000" 
               max="1000" 
               step="10" 
               value="300"
               style="width: 100%">
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
